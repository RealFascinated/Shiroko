services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arona}
      POSTGRES_DB: ${POSTGRES_DB:-arona}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data-18:/var/lib/postgresql
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-arona}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-arona-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data-18:
  minio-data:
